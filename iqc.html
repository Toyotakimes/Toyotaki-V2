<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQC — Dashboard đầu vào</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --bg-page:#EEF1F5;
      --bg-panel:#FFFFFF;
      --bg-sunken:#F5F7FA;
      --bg-header:#1E293B;
      --border:#D9DFE5;
      --border-strong:#B8C1CC;
      --text:#0F172A;
      --text-muted:#64748B;
      --text-dim:#94A3B8;
      --accent:#0F5FA5;
      --accent-hover:#0A4681;
      --run-fg:#047857;
      --run-bg:#ECFDF5;
      --warn-fg:#B45309;
      --warn-bg:#FFFBEB;
      --alarm-fg:#B91C1C;
      --alarm-bg:#FEF2F2;
      --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
      --shadow-md:0 4px 12px rgba(15,23,42,0.08);
      --shadow-lg:0 12px 32px rgba(15,23,42,0.16);
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0;
      background:var(--bg-page);
      color:var(--text);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      font-size:13px;
      line-height:1.35;
      -webkit-font-smoothing:antialiased;
    }
    body {
      min-height:100vh;
      padding:6px 8px 8px;
    }
    .app {
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:calc(100vh - 20px);
    }
    .topbar {
      background:var(--bg-header);
      color:#F1F5F9;
      border-radius:8px;
      padding:8px 14px;
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:var(--shadow-sm);
      flex-wrap:wrap;
    }
    .brand {
      display:flex;
      flex-direction:column;
      line-height:1.2;
    }
    .co {
      font-size:9px;
      letter-spacing:.08em;
      color:#94A3B8;
      text-transform:uppercase;
      font-weight:500;
    }
    .title {
      font-size:14px;
      font-weight:700;
      letter-spacing:-.01em;
      color:#FFF;
    }
    .meta {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .chip {
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.04);
      font-size:11px;
      color:#E2E8F0;
    }
    .chip strong { color:#fff; }
    .page { 
      background:var(--bg-panel);
      border-radius:8px;
      border:1px solid var(--border);
      box-shadow:var(--shadow-sm);
      overflow:hidden;
      flex:1;
      min-height:0;
    }
    .page iframe {
      display:block;
      width:100%;
      height:calc(100vh - 150px);
      border:0;
      background:#fff;
    }
    .notice {
      padding:10px 14px;
      background:var(--bg-sunken);
      border-bottom:1px solid var(--border);
      font-size:12px;
      color:var(--text-muted);
    }
    @media (max-width:820px) {
      body { padding:6px 6px 8px; }
      .page iframe { height:calc(100vh - 160px); }
      .meta { width:100%; justify-content:flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="co">Toyotaki</span>
        <span class="title">IQC — Dashboard đầu vào</span>
      </div>
      <div class="meta">
        <span class="chip"><strong>Nguồn:</strong> Hệ thống IQC hiện có</span>
      </div>
    </header>

    <div class="page">
      <div class="notice">
        Trang này giữ nguyên dữ liệu và logic của hệ thống IQC hiện tại; chỉ bổ sung khung giao diện MES để đồng bộ với các module khác.
      </div>
      <iframe
        title="IQC Dashboard"
        src="https://script.google.com/macros/s/AKfycbzVbsp3RA3ItZct2jLmNBxa9EEgPbowA3uTXP1CNu4_JYw-oMHrWzrqNOwskwf4R02bgQ/exec">
      </iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/supabase-client.js"></script>
  <script src="shared/navbar.js"></script>
</body>
</html>
