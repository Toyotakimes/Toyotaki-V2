<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OQC kiểm tra hằng ngày</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font:14px Arial}header{background:#1e293b;color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center}header a{color:#bfdbfe}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:#fff;border-radius:10px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.head{padding:13px 16px;border-bottom:1px solid #ddd;font-weight:800}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#475569}input,select,textarea,button{font:inherit}input,select,textarea{padding:9px;border:1px solid #aab4c2;border-radius:6px}.readonly{background:#f1f5f9}.defects{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:bold;cursor:pointer}.primary{background:#1769aa;color:#fff}.secondary{background:#e2e8f0}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#f8fafc;padding:12px;border-radius:8px}.card b{font-size:22px;display:block}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}th{background:#f8fafc}.bars>div{margin:7px 0}.bar{height:18px;background:#e2e8f0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#dc2626}.msg{padding:10px;margin-bottom:10px;border-radius:6px;display:none}.err{display:block;background:#fee2e2;color:#991b1b}.ok{display:block;background:#dcfce7;color:#166534}@media(max-width:900px){.grid,.cards{grid-template-columns:1fr 1fr}.defects{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header><b>OQC — NHẬP KIỂM TRA SAU GIA CÔNG</b><a href="oqc.html">Đóng pallet OQC</a><a href="khsx-tuan.html">KHSX tuần</a><span id="who" style="margin-left:auto"></span></header><div class="wrap"><div id="msg" class="msg"></div>
<section class="panel"><div class="head">Nhập nhanh hằng ngày</div><div class="body"><form id="form"><div class="grid">
<div class="field"><label>Ngày kiểm tra</label><input type="date" id="date" required></div><div class="field"><label>Ca</label><select id="shift"><option>Ca 1</option><option>Ca 2</option><option>Ca 3</option></select></div><div class="field"><label>Mã sản phẩm</label><input id="code" list="products" required autocomplete="off"><datalist id="products"></datalist></div><div class="field"><label>Tên sản phẩm</label><input id="name" class="readonly" readonly></div>
<div class="field"><label>Người kiểm</label><input id="inspector" class="readonly" readonly></div><div class="field"><label>Tổng kiểm</label><input type="number" min="0" id="total" required></div><div class="field"><label>NG</label><input type="number" min="0" id="ng" required value="0"></div><div class="field"><label>OK (tự tính)</label><input id="ok" class="readonly" readonly></div>
<div class="field"><label>% OK</label><input id="okPct" class="readonly" readonly></div><div class="field"><label>% NG</label><input id="ngPct" class="readonly" readonly></div><div class="field"><label>Cách đếm lỗi</label><select id="mode"><option value="OCCURRENCE">Theo số lần phát sinh lỗi (tổng lỗi ≥ NG)</option><option value="PRODUCT">Theo sản phẩm NG (tổng lỗi = NG)</option></select></div><div class="field"><label>KHSX / Đã kiểm / Còn lại</label><input id="plan" class="readonly" readonly></div></div>
<h3>Chi tiết lỗi <small style="color:#64748b;font-weight:normal">Mặc định: đếm theo số lần phát sinh; một sản phẩm có thể có nhiều lỗi.</small></h3><div class="defects" id="defects"></div><br>
<div class="field"><label>Ghi chú</label><textarea id="note"></textarea></div><br><button class="btn primary" id="save">Lưu record</button><button type="button" class="btn secondary" onclick="resetForm()">Làm mới</button></form></div></section>
<section class="panel"><div class="head">Thống kê OQC</div><div class="body"><div class="grid"><div class="field"><label>Xem nhanh</label><select id="period" onchange="setPeriod(this.value)"><option value="day">Hôm nay</option><option value="week">Tuần này</option><option value="month">Tháng này</option><option value="custom" selected>Khoảng ngày</option></select></div><div class="field"><label>Từ ngày</label><input type="date" id="from"></div><div class="field"><label>Đến ngày</label><input type="date" id="to"></div><div class="field"><label>Mã/Tên SP</label><input id="filterProduct"></div><div class="field"><label>Người kiểm</label><input id="filterInspector"></div><div class="field"><label>Ca</label><select id="filterShift"><option value="">Tất cả</option><option>Ca 1</option><option>Ca 2</option><option>Ca 3</option></select></div><div><button class="btn primary" onclick="loadStats()">Xem</button> <button class="btn secondary" onclick="exportExcel()">Xuất Excel</button></div></div><br><div class="cards" id="cards"></div><div class="grid"><div><h3>Pareto / Top lỗi</h3><div class="bars" id="pareto"></div></div><div><h3>Top sản phẩm NG</h3><div id="topProducts"></div></div><div style="grid-column:span 2"><h3>Xu hướng NG theo ngày</h3><div id="trend"></div></div></div><h3>Chi tiết record</h3><div style="overflow:auto"><table><thead><tr><th>Ngày giờ</th><th>Ca</th><th>Mã SP</th><th>Tên SP</th><th>Người kiểm</th><th>Tổng</th><th>OK</th><th>NG</th><th>%NG</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="shared/supabase-client.js"></script><script src="shared/navbar.js"></script><script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let identity='',catalog=[],dataRows=[],productMap={},editing=null;
function message(s,bad=false){$('msg').textContent=s;$('msg').className='msg '+(bad?'err':'ok')}
function localDate(d=new Date()){d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
async function init(){await MesAuth.requireAuth();identity=await MesAuth.getCurrentUserIdentity()||'';$('who').textContent=identity;$('inspector').value=identity;$('date').value=localDate();$('from').value=localDate(new Date(Date.now()-30*864e5));$('to').value=localDate();const [p,c]=await Promise.all([sb.from('master_products').select('ma_sp,ten_sp').order('ma_sp'),sb.from('oqc_defect_catalog').select('*').eq('is_active',true).order('sort_order')]);if(p.error)return message(p.error.message,true);if(c.error)return message('Chưa chạy migration OQC T38: '+c.error.message,true);(p.data||[]).forEach(x=>productMap[x.ma_sp]=x.ten_sp||'');$('products').innerHTML=Object.keys(productMap).map(x=>'<option value="'+E(x)+'">'+E(productMap[x])+'</option>').join('');catalog=c.data||[];renderDefects();calc();loadStats()}
function renderDefects(){$('defects').innerHTML=catalog.map(x=>'<div class="field"><label>'+E(x.label)+'</label><input class="defect" data-code="'+E(x.code)+'" type="number" min="0" value="0"></div>').join('')}
function calc(){const t=Number($('total').value)||0,n=Number($('ng').value)||0,o=t-n;$('ok').value=o>=0?o:'';$('okPct').value=t?(o/t*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'0%';$('ngPct').value=t?(n/t*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'0%'}
$('total').oninput=$('ng').oninput=calc;$('code').onchange=$('code').oninput=()=>{$('name').value=productMap[$('code').value]||'';loadPlan()};
function setPeriod(v){const now=new Date(),from=new Date(now);if(v==='day'){}else if(v==='week')from.setDate(now.getDate()-((now.getDay()+6)%7));else if(v==='month')from.setDate(1);else return;$('from').value=localDate(from);$('to').value=localDate(now);loadStats()}
async function loadPlan(){const code=$('code').value,d=$('date').value;if(!code||!d)return $('plan').value='';const x=new Date(d+'T00:00:00'),day=['cn','t2','t3','t4','t5','t6','t7'][x.getDay()];const mon=new Date(x);mon.setDate(x.getDate()-((x.getDay()+6)%7));const m=localDate(mon);const [p,o]=await Promise.all([sb.from('cd_khsx_tuan_plan').select(day).eq('tuan_bat_dau',m).eq('cong_doan','OQC').eq('ma_sp',code).maybeSingle(),sb.from('oqc_daily_inspection').select('total_qty').eq('inspection_date',d).eq('product_code',code)]);const plan=Number(p.data&&p.data[day])||0,checked=(o.data||[]).reduce((s,r)=>s+Number(r.total_qty||0),0);$('plan').value=plan.toLocaleString('vi-VN')+' / '+checked.toLocaleString('vi-VN')+' / '+Math.max(0,plan-checked).toLocaleString('vi-VN')}
$('form').onsubmit=async e=>{e.preventDefault();const t=Number($('total').value),n=Number($('ng').value);if(!Number.isFinite(t)||!Number.isFinite(n)||n<0||n>t)return message('OK + NG phải bằng Tổng kiểm; NG không được vượt Tổng kiểm.',true);if(!Object.prototype.hasOwnProperty.call(productMap,$('code').value))return message('Mã sản phẩm không có trong Master.',true);const defects={};document.querySelectorAll('.defect').forEach(x=>defects[x.dataset.code]=Number(x.value)||0);const sum=Object.values(defects).reduce((a,b)=>a+b,0),mode=$('mode').value;if(mode==='PRODUCT'&&sum!==n)return message('Đếm theo sản phẩm NG: tổng lỗi chi tiết phải bằng NG.',true);if(mode==='OCCURRENCE'&&sum<n)return message('Đếm theo lần phát sinh: tổng lỗi chi tiết phải ≥ NG.',true);const d={inspection_date:$('date').value,shift:$('shift').value,product_code:$('code').value,product_name:$('name').value,total_qty:t,ng_qty:n,count_mode:mode,defects,note:$('note').value};$('save').disabled=true;const {error}=await sb.rpc('oqc_save_daily_inspection',{p_id:editing,p_data:d,p_actor:identity});$('save').disabled=false;if(error)return message(error.message,true);message(editing?'Đã cập nhật và lưu lịch sử.':'Đã lưu record OQC.');resetForm();loadStats()};
function resetForm(){editing=null;$('form').reset();$('date').value=localDate();$('inspector').value=identity;renderDefects();calc()}
async function loadStats(){let q=sb.from('oqc_daily_inspection').select('*').gte('inspection_date',$('from').value).lte('inspection_date',$('to').value).order('created_at',{ascending:false});const {data,error}=await q;if(error)return message(error.message,true);let rows=data||[],fp=$('filterProduct').value.toLowerCase(),fi=$('filterInspector').value.toLowerCase(),fs=$('filterShift').value;dataRows=rows.filter(r=>(!fp||(r.product_code+' '+r.product_name).toLowerCase().includes(fp))&&(!fi||r.inspector_name.toLowerCase().includes(fi))&&(!fs||r.shift===fs));renderStats()}
function renderStats(){const t=dataRows.reduce((s,r)=>s+Number(r.total_qty),0),o=dataRows.reduce((s,r)=>s+Number(r.ok_qty),0),n=dataRows.reduce((s,r)=>s+Number(r.ng_qty),0);$('cards').innerHTML=[['Tổng kiểm',t],['OK',o],['NG',n],['% OK',t?(o/t*100).toFixed(2)+'%':'0%'],['% NG',t?(n/t*100).toFixed(2)+'%':'0%']].map(x=>'<div class="card">'+x[0]+'<b>'+E(x[1])+'</b></div>').join('');const dm={},pm={},tm={};dataRows.forEach(r=>{Object.entries(r.defects||{}).forEach(([k,v])=>dm[k]=(dm[k]||0)+Number(v));const p=pm[r.product_code]||(pm[r.product_code]={name:r.product_name,ng:0,total:0});p.ng+=Number(r.ng_qty);p.total+=Number(r.total_qty);const d=r.inspection_date;tm[d]=(tm[d]||0)+Number(r.ng_qty)});const ds=Object.entries(dm).sort((a,b)=>b[1]-a[1]),max=ds[0]?.[1]||1;$('pareto').innerHTML=ds.map(([k,v])=>'<div>'+E(catalog.find(x=>x.code===k)?.label||k)+' — '+v+'<div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>').join('');$('topProducts').innerHTML=Object.entries(pm).sort((a,b)=>b[1].ng/b[1].total-a[1].ng/a[1].total).slice(0,10).map(([k,v])=>'<div>'+E(k)+' — '+v.ng+' NG / '+v.total+'</div>').join('');$('trend').innerHTML=Object.entries(tm).sort().map(([d,v])=>'<span style="display:inline-block;padding:8px;margin:3px;background:#fee2e2">'+d+': <b>'+v+' NG</b></span>').join('');$('rows').innerHTML=dataRows.map(r=>'<tr><td>'+new Date(r.created_at).toLocaleString('vi-VN')+'</td><td>'+E(r.shift)+'</td><td>'+E(r.product_code)+'</td><td>'+E(r.product_name)+'</td><td>'+E(r.inspector_name)+'</td><td>'+r.total_qty+'</td><td>'+r.ok_qty+'</td><td>'+r.ng_qty+'</td><td>'+(r.total_qty?(r.ng_qty/r.total_qty*100).toFixed(2):0)+'%</td><td><button onclick="editRow('+r.id+')">Sửa</button></td></tr>').join('')}
function editRow(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editing=id;$('date').value=r.inspection_date;$('shift').value=r.shift;$('code').value=r.product_code;$('name').value=r.product_name;$('total').value=r.total_qty;$('ng').value=r.ng_qty;$('mode').value=r.count_mode;$('note').value=r.note||'';document.querySelectorAll('.defect').forEach(x=>x.value=(r.defects||{})[x.dataset.code]||0);calc();scrollTo({top:0,behavior:'smooth'})}
function exportExcel(){const out=dataRows.map(r=>({Ngày:r.inspection_date,Ca:r.shift,'Mã SP':r.product_code,'Tên SP':r.product_name,'Người kiểm':r.inspector_name,'Tổng kiểm':r.total_qty,OK:r.ok_qty,NG:r.ng_qty,'%OK':r.total_qty?r.ok_qty/r.total_qty:0,'%NG':r.total_qty?r.ng_qty/r.total_qty:0,...r.defects}));const ws=XLSX.utils.json_to_sheet(out),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'OQC');XLSX.writeFile(wb,'thong-ke-oqc-'+$('from').value+'_'+$('to').value+'.xlsx')}
init();</script></body></html>
